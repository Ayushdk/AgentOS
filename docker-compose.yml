services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_local
      POSTGRES_DB: agentos
    ports:
      - "55432:5432"
    volumes:
      - agentos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  agentos-postgres:

