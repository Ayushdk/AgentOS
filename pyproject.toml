[project]
name = "agentos"
version = "1.0.0"
description = "Synthetic employee support and durable HR workflows"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary,pool]>=3.2,<4",
 "pgvector>=0.4,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
 "mcp>=1.26,<2", "google-genai>=1.0,<2", "fastembed>=0.7,<1",
 "sqlglot>=26,<30", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1",
 "psutil>=7,<8", "tzdata>=2025.1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/agentos"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency injection defaults are intentional.
